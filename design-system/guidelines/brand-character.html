<!-- @dsCard group="Brand" viewport="700x420" name="Mos Character" subtitle="The companion — 6 expressions for product & marketing moments" -->
<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; font-family: var(--font-body); background: var(--surface-page); padding: var(--space-lg); }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--space-base); }
  .pose { background: var(--surface-card); border: 1px solid var(--border-subtle); border-radius: var(--radius-lg); box-shadow: var(--shadow-e1); padding: var(--space-base); display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .pose img { width: 96px; height: 96px; object-fit: contain; }
  .name { font-size: 13px; font-weight: 600; color: var(--text-strong); }
  .use { font-size: 11px; color: var(--text-muted); text-align: center; line-height: 1.45; }
</style>
</head>
<body>
  <div class="grid">
    <div class="pose"><img src="../assets/character/mos-greeting.png" alt="Mos greeting"><span class="name">Greeting</span><span class="use">온보딩 · 첫 인사 · 환영 화면</span></div>
    <div class="pose"><img src="../assets/character/mos-happy.png" alt="Mos happy"><span class="name">Happy</span><span class="use">작업 완료 · 성공 · 축하 모먼트</span></div>
    <div class="pose"><img src="../assets/character/mos-curious.png" alt="Mos curious"><span class="name">Curious</span><span class="use">질문 · 확인 요청 · 빈 상태</span></div>
    <div class="pose"><img src="../assets/character/mos-working.png" alt="Mos working"><span class="name">Working</span><span class="use">작업 진행 중 · 로딩 · 처리 상태</span></div>
    <div class="pose"><img src="../assets/character/mos-resting.png" alt="Mos resting"><span class="name">Resting</span><span class="use">대기 · 휴식 · 차분한 안내</span></div>
    <div class="pose"><img src="../assets/character/mos-sleeping.png" alt="Mos sleeping"><span class="name">Sleeping</span><span class="use">비활성 · 야간 모드 · 알림 끔</span></div>
  </div>
</body>
</html>
