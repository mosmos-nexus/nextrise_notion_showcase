<!-- @dsCard group="Colors" viewport="700x190" name="Brand Blue" subtitle="The living-world blue — Core / Classic / Light" -->
<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; font-family: var(--font-body); background: var(--surface-page); }
  .row { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--space-base); padding: var(--space-lg); }
  .sw { border-radius: var(--radius-md); overflow: hidden; box-shadow: var(--shadow-e1); }
  .chip { height: 88px; }
  .meta { padding: 10px 12px 12px; background: var(--surface-card); }
  .name { font-size: 14px; font-weight: 600; color: var(--text-strong); }
  .hex { font-size: 12px; color: var(--text-muted); margin-top: 2px; letter-spacing: .02em; }
</style>
</head>
<body>
  <div class="row">
    <div class="sw"><div class="chip" style="background:var(--blue-core)"></div><div class="meta"><div class="name">Core Blue</div><div class="hex">#0F6FDA · primary</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--blue-classic)"></div><div class="meta"><div class="name">Classic Blue</div><div class="hex">#568BD8 · wordmark</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--blue-light)"></div><div class="meta"><div class="name">Light Blue</div><div class="hex">#9CBDE9 · tints</div></div></div>
  </div>
</body>
</html>
