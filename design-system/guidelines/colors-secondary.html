<!-- @dsCard group="Colors" viewport="700x190" name="Secondary & Accent" subtitle="Pop Purple secondary, Bright Cyan accent" -->
<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; font-family: var(--font-body); background: var(--surface-page); }
  .row { display: grid; grid-template-columns: repeat(2, 1fr); gap: var(--space-base); padding: var(--space-lg); }
  .sw { border-radius: var(--radius-md); overflow: hidden; box-shadow: var(--shadow-e1); }
  .chip { height: 88px; }
  .meta { padding: 10px 12px 12px; background: var(--surface-card); }
  .name { font-size: 14px; font-weight: 600; color: var(--text-strong); }
  .hex { font-size: 12px; color: var(--text-muted); margin-top: 2px; letter-spacing: .02em; }
</style>
</head>
<body>
  <div class="row">
    <div class="sw"><div class="chip" style="background:var(--purple-pop)"></div><div class="meta"><div class="name">Pop Purple</div><div class="hex">#9B6EEF · secondary</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--cyan-bright)"></div><div class="meta"><div class="name">Bright Cyan</div><div class="hex">#00A0A3 · accent</div></div></div>
  </div>
</body>
</html>
