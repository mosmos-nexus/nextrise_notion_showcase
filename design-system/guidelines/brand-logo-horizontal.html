<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; font-family: var(--font-body); background: var(--surface-page); padding: var(--space-xl); display:flex; flex-direction:column; gap: var(--space-base); }
  .lockup { border-radius: var(--radius-lg); padding: var(--space-lg) var(--space-xl); display:flex; align-items:center; }
  .light { background: var(--clear-white); border:1px solid var(--border-subtle); }
  .dark { background: var(--blue-black); }
  img { height: 44px; }
</style>
</head>
<body>
  <div class="lockup light"><img src="../assets/logos/mosmos-horizontal-color.svg" alt="mosmos"></div>
  <div class="lockup light"><img src="../assets/logos/mosmos-horizontal-black.svg" alt="mosmos"></div>
  <div class="lockup dark"><img src="../assets/logos/mosmos-horizontal-white.svg" alt="mosmos"></div>
</body>
</html>
