<!-- @dsCard group="Spacing" viewport="700x230" name="Spacing Scale" subtitle="4px base unit · xs → 5xl" -->
<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; font-family: var(--font-body); background: var(--surface-page); padding: var(--space-xl); }
  .row { display:flex; align-items:center; gap: var(--space-base); margin-bottom: 10px; }
  .lbl { width: 96px; flex:none; font-size:13px; color: var(--text-muted); }
  .lbl b { color: var(--text-strong); font-weight:600; }
  .bar { height: 16px; border-radius: 4px; background: var(--gradient-brand); }
</style>
</head>
<body>
  <div class="row"><span class="lbl"><b>xs</b> · 4</span><span class="bar" style="width:4px"></span></div>
  <div class="row"><span class="lbl"><b>sm</b> · 8</span><span class="bar" style="width:8px"></span></div>
  <div class="row"><span class="lbl"><b>md</b> · 12</span><span class="bar" style="width:12px"></span></div>
  <div class="row"><span class="lbl"><b>base</b> · 16</span><span class="bar" style="width:16px"></span></div>
  <div class="row"><span class="lbl"><b>lg</b> · 24</span><span class="bar" style="width:24px"></span></div>
  <div class="row"><span class="lbl"><b>xl</b> · 32</span><span class="bar" style="width:32px"></span></div>
  <div class="row"><span class="lbl"><b>2xl</b> · 48</span><span class="bar" style="width:48px"></span></div>
  <div class="row"><span class="lbl"><b>3xl</b> · 64</span><span class="bar" style="width:64px"></span></div>
  <div class="row"><span class="lbl"><b>4xl</b> · 96</span><span class="bar" style="width:96px"></span></div>
  <div class="row"><span class="lbl"><b>5xl</b> · 128</span><span class="bar" style="width:128px"></span></div>
</body>
</html>
