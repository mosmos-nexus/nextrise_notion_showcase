<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; font-family: var(--font-body); background: var(--surface-page); padding: var(--space-xl); display:flex; flex-direction:column; gap: var(--space-base); max-width:700px; }
  .lbl { font-size: 11px; letter-spacing:.06em; text-transform:uppercase; color: var(--text-faint); margin-bottom: 4px; }
  .subtitle { font-size: 20px; line-height:1.4; font-weight:500; color: var(--text-strong); }
  .body { font-size: 16px; line-height:1.6; color: var(--text-body); }
  .caption { font-size: 13px; line-height:1.5; color: var(--text-muted); }
</style>
</head>
<body>
  <div><div class="lbl">Subtitle · 20 / Medium</div><div class="subtitle">목표만 말하면, 당신의 AI 아바타가 결과를 가져옵니다.</div></div>
  <div><div class="lbl">Body · 16 / Regular</div><div class="body">쓰면 쓸수록 당신을 닮아가며 자라는, 다정한 AI의 세계. 흩어진 가능성을 연결해 하나의 결과로 만들어 드립니다.</div></div>
  <div><div class="lbl">Caption · 13 / Regular</div><div class="caption">신청하시면 베타 오픈 소식을 가장 먼저 전해 드릴게요.</div></div>
</body>
</html>
