<!-- @dsCard group="Brand" viewport="700x220" name="Symbol Mark" subtitle="The Mos blob + Monad dot — gradient, black, white" -->
<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; font-family: var(--font-body); background: var(--surface-page); padding: var(--space-xl); }
  .row { display:flex; gap: var(--space-base); }
  .tile { flex:1; border-radius: var(--radius-lg); padding: var(--space-lg); display:flex; flex-direction:column; align-items:center; gap: 12px; }
  .light { background: var(--clear-white); border:1px solid var(--border-subtle); }
  .dark { background: var(--blue-black); }
  img { height: 84px; }
  .cap { font-size: 12px; color: var(--text-muted); }
  .dark .cap { color: var(--blue-gray-light); }
</style>
</head>
<body>
  <div class="row">
    <div class="tile light"><img src="../assets/logos/mosmos-symbol-gradient.svg" alt="symbol"><span class="cap">Gradient · primary</span></div>
    <div class="tile light"><img src="../assets/logos/mosmos-symbol-black.svg" alt="symbol"><span class="cap">Mono · Blue Black</span></div>
    <div class="tile dark"><img src="../assets/logos/mosmos-symbol-white.svg" alt="symbol"><span class="cap">Mono · Clear White</span></div>
  </div>
</body>
</html>
