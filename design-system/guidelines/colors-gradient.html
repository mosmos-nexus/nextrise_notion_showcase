<!-- @dsCard group="Colors" viewport="700x180" name="Brand Gradient" subtitle="Core Blue → Light Blue — the world's signature sky" -->
<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; font-family: var(--font-body); background: var(--surface-page); padding: var(--space-lg); display:flex; flex-direction:column; gap: var(--space-md); }
  .g { height: 84px; border-radius: var(--radius-lg); display:flex; align-items:flex-end; padding: 12px 16px; color:#fff; font-size:13px; font-weight:600; box-shadow: var(--shadow-e2); }
  .brand { background: var(--gradient-brand); }
  .sky { background: var(--gradient-sky); color: var(--text-muted); border:1px solid var(--border-subtle); }
</style>
</head>
<body>
  <div class="g brand">Brand · linear-gradient(135deg, #0F6FDA → #9CBDE9)</div>
  <div class="g sky">Sky · linear-gradient(180deg, #EAF2FC → #F7F8F9)</div>
</body>
</html>
