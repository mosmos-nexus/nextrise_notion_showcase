<!-- @dsCard group="Colors" viewport="700x190" name="Neutrals" subtitle="Clear White & Blue Black anchor every surface" -->
<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; font-family: var(--font-body); background: var(--surface-page); }
  .row { display: grid; grid-template-columns: repeat(2, 1fr); gap: var(--space-base); padding: var(--space-lg); }
  .sw { border-radius: var(--radius-md); overflow: hidden; box-shadow: var(--shadow-e1); border: 1px solid var(--border-subtle); }
  .chip { height: 88px; }
  .meta { padding: 10px 12px 12px; background: var(--surface-card); }
  .name { font-size: 14px; font-weight: 600; color: var(--text-strong); }
  .hex { font-size: 12px; color: var(--text-muted); margin-top: 2px; letter-spacing: .02em; }
</style>
</head>
<body>
  <div class="row">
    <div class="sw"><div class="chip" style="background:var(--clear-white)"></div><div class="meta"><div class="name">Clear White</div><div class="hex">#F7F8F9 · light surface</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--blue-black)"></div><div class="meta"><div class="name">Blue Black</div><div class="hex">#1D2026 · dark surface / ink</div></div></div>
  </div>
</body>
</html>
