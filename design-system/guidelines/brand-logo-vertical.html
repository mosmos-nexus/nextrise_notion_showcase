<!-- @dsCard group="Brand" viewport="700x340" name="Logo — Vertical Signature" subtitle="Center-aligned lockup · full color, mono black, mono white" -->
<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; font-family: var(--font-body); background: var(--surface-page); padding: var(--space-xl); }
  .row { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--space-base); }
  .tile { border-radius: var(--radius-lg); padding: var(--space-lg); display: flex; flex-direction: column; align-items: center; gap: var(--space-sm); }
  .light { background: var(--clear-white); border: 1px solid var(--border-subtle); }
  .dark { background: var(--blue-black); }
  img { height: 140px; }
  .cap { font-size: 12px; color: var(--text-muted); }
  .dark .cap { color: var(--blue-gray-light); }
</style>
</head>
<body>
  <div class="row">
    <div class="tile light"><img src="../assets/logos/mosmos-vertical-color.svg" alt="Mosmos vertical full color"><span class="cap">Full color · primary</span></div>
    <div class="tile light"><img src="../assets/logos/mosmos-vertical-black.svg" alt="Mosmos vertical mono black"><span class="cap">Mono · Blue Black</span></div>
    <div class="tile dark"><img src="../assets/logos/mosmos-vertical-white.svg" alt="Mosmos vertical mono white"><span class="cap">Mono · Clear White</span></div>
  </div>
</body>
</html>
