<!-- @dsCard group="Brand" viewport="700x300" name="Logo — Wordmark (Text)" subtitle="Logotype · secondary · pair with symbol — do not use alone" -->
<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; font-family: var(--font-body); background: var(--surface-page); padding: var(--space-xl); display: flex; flex-direction: column; gap: var(--space-base); }
  .lockup { border-radius: var(--radius-lg); padding: var(--space-lg) var(--space-xl); display: flex; align-items: center; justify-content: space-between; gap: var(--space-lg); }
  .light { background: var(--clear-white); border: 1px solid var(--border-subtle); }
  .dark { background: var(--blue-black); }
  img { height: 30px; }
  .cap { font-size: 12px; color: var(--text-muted); flex: none; }
  .dark .cap { color: var(--blue-gray-light); }
</style>
</head>
<body>
  <div class="lockup light"><img src="../assets/logos/mosmos-text-color.svg" alt="Mosmos wordmark full color"><span class="cap">Full color · secondary</span></div>
  <div class="lockup light"><img src="../assets/logos/mosmos-text-black.svg" alt="Mosmos wordmark mono black"><span class="cap">Mono · Blue Black</span></div>
  <div class="lockup dark"><img src="../assets/logos/mosmos-text-white.svg" alt="Mosmos wordmark mono white"><span class="cap">Mono · Clear White</span></div>
</body>
</html>
