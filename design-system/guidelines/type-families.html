<!-- @dsCard group="Type" viewport="700x220" name="Font Families" subtitle="NanumSquare for display · Pretendard Variable for everything else" -->
<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; font-family: var(--font-body); background: var(--surface-page); padding: var(--space-xl); display:flex; flex-direction:column; gap: var(--space-xl); }
  .tag { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--text-muted); margin-bottom: 8px; }
  .disp { font-family: var(--font-display); font-weight: 700; font-size: 40px; color: var(--text-strong); line-height: 1.1; }
  .bod { font-family: var(--font-body); font-size: 28px; color: var(--text-strong); }
  .bod .w { display:flex; gap: 18px; align-items:baseline; }
  .wt { font-size: 13px; color: var(--text-muted); }
</style>
</head>
<body>
  <div>
    <div class="tag">Display · 나눔스퀘어 Bold</div>
    <div class="disp">내 AI가 자라는 세계 · Aa Gg 0123</div>
  </div>
  <div>
    <div class="tag">Body / UI · Pretendard Variable</div>
    <div class="bod"><span class="w"><span style="font-weight:400">Regular</span> <span style="font-weight:500">Medium</span> <span style="font-weight:600">SemiBold</span> <span style="font-weight:700">Bold</span></span></div>
  </div>
</body>
</html>
