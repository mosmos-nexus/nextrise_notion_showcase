<!-- @dsCard group="Colors" viewport="700x150" name="Status" subtitle="Success / Error / Warning / Info" -->
<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; font-family: var(--font-body); background: var(--surface-page); }
  .row { display: grid; grid-template-columns: repeat(4, 1fr); gap: var(--space-md); padding: var(--space-lg); }
  .sw { border-radius: var(--radius-md); overflow: hidden; box-shadow: var(--shadow-e1); }
  .chip { height: 56px; }
  .meta { padding: 8px 10px 10px; background: var(--surface-card); }
  .name { font-size: 13px; font-weight: 600; color: var(--text-strong); }
  .hex { font-size: 11px; color: var(--text-muted); margin-top: 2px; }
</style>
</head>
<body>
  <div class="row">
    <div class="sw"><div class="chip" style="background:var(--status-success)"></div><div class="meta"><div class="name">Clean Green</div><div class="hex">#4FA136 · success</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--status-error)"></div><div class="meta"><div class="name">Coral Red</div><div class="hex">#E95353 · error</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--status-warning)"></div><div class="meta"><div class="name">Dark Orange</div><div class="hex">#C77E00 · warning</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--status-info)"></div><div class="meta"><div class="name">Pure Blue</div><div class="hex">#4689E9 · info</div></div></div>
  </div>
</body>
</html>
