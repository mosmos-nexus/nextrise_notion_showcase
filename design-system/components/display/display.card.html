<!-- @dsCard group="Components" viewport="700x420" name="Cards, Badges & Avatars" subtitle="Display — surfaces, labels, companions" -->
<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<style>
  body { margin: 0; font-family: var(--font-body); background: var(--surface-subtle); padding: var(--space-xl); }
  .group { margin-bottom: var(--space-xl); }
  .glabel { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--text-faint); margin-bottom: 12px; }
  .row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
  .cards { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
</style>
</head>
<body>
  <div id="root"></div>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script src="../../_ds_bundle.js"></script>
  <script type="text/babel">
    const { Card, Badge, Avatar } = window.MosmosDesignSystem_53320b;
    const Glyph = ({d}) => (
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d={d}/></svg>
    );
    function Demo() {
      return (
        <div>
          <div className="group">
            <div className="glabel">Feature cards</div>
            <div className="cards">
              <Card accent="blue" interactive
                icon={<Glyph d="M12 2v4M12 18v4M4.9 4.9l2.8 2.8M16.3 16.3l2.8 2.8M2 12h4M18 12h4" />}
                title="말만 하세요"
                description="목표만 알려주면 Mos가 알아서 결과를 가져옵니다." />
              <Card accent="purple" interactive
                icon={<Glyph d="M12 3l1.9 5.8H20l-4.9 3.6 1.9 5.8L12 14.6 7 18.2l1.9-5.8L4 8.8h6.1z" />}
                title="자라는 AI"
                description="쓸수록 당신을 닮아가며 함께 성장하는 다정한 조력자." />
            </div>
          </div>
          <div className="group">
            <div className="glabel">Badges</div>
            <div className="row">
              <Badge tone="primary">사전신청 진행중</Badge>
              <Badge tone="success" dot>오픈 완료</Badge>
              <Badge tone="secondary" variant="solid" size="sm">NEW</Badge>
              <Badge tone="accent" variant="outline">베타</Badge>
              <Badge tone="warning">점검중</Badge>
              <Badge tone="error" dot>오류</Badge>
            </div>
          </div>
          <div className="group">
            <div className="glabel">Avatars</div>
            <div className="row">
              <Avatar name="민지" size={48} />
              <Avatar name="Jin" size={48} ring />
              <Avatar name="Mos" size={48} shape="rounded" ring />
              <Avatar name="다온" size={48} shape="pill" />
            </div>
          </div>
        </div>
      );
    }
    ReactDOM.createRoot(document.getElementById("root")).render(<Demo />);
  </script>
</body>
</html>
