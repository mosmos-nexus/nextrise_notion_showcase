<!-- ════════════════════════════════════════════════════════════
     S2e · 중헌아카이브 — 지표 count-up + Takeaway + QR 배지 (WP4)
     ════════════════════════════════════════════════════════════ -->
<section class="slide" id="s2e" data-section="2">
  <div class="bg">
    <div class="grid-lines"></div>
    <div class="glow g1"></div><div class="glow g2"></div>
    <span class="blk b2"></span><span class="blk b3"></span><span class="blk b5"></span>
  </div>
  <header>
    <div class="kicker rv" style="--d:.05s">구조를 갖추니, 이렇게 자랐어요</div>
    <h2 class="headline rv" style="--d:.18s">숫자가 말해주는 <em>자라는 워크스페이스</em></h2>
  </header>
  <div class="grid4">
    <div class="metric rv" style="--d:.4s">
      <div class="mi"><svg data-lucide="users"></svg></div>
      <div class="num"><span class="count" data-to="1400" data-suffix="+">0</span></div>
      <div class="lbl">팔로워</div>
    </div>
    <div class="metric rv" style="--d:.55s">
      <div class="mi"><svg data-lucide="archive"></svg></div>
      <div class="num"><span class="count" data-to="700" data-suffix="+">0</span></div>
      <div class="lbl">아카이빙</div>
    </div>
    <div class="metric rv" style="--d:.7s">
      <div class="mi"><svg data-lucide="eye"></svg></div>
      <div class="num"><span class="count" data-to="11000" data-suffix="+">0</span></div>
      <div class="lbl">최고 조회</div>
    </div>
    <div class="metric rv" style="--d:.85s">
      <div class="mi"><svg data-lucide="repeat"></svg></div>
      <div class="num">15~<span class="count" data-to="20" data-suffix="%">0</span></div>
      <div class="lbl">재방문율</div>
    </div>
  </div>
  <img class="mon m-research mon a float rv-pop" style="--d:1.15s" src="deck-assets/mon-research.png" alt="">
  <img class="mon m-organize mon b float f3 rv-pop" style="--d:1.3s" src="deck-assets/mon-organize.png" alt="">
  <div class="takeaway rv" style="--d:1.05s">
    <span class="tag">TAKEAWAY</span>
    <p>혼자 쓰는 노션도 구조를 갖추면 이렇게 자랍니다 — <b>표 설계 + AI 분류 + 자동화</b>, 오늘 바로 따라 해보실 수 있어요.</p>
  </div>
  <!-- QR 고정 배지 (D6) — corner-fixed, separated from hero/takeaway -->
  <div class="qr-badge rv" style="--d:1.4s">
    <img src="assets/resources/joongheon_archive/qr_code.svg" alt="중헌아카이브 QR 코드">
    <span class="qr-label">지금 들어가보세요</span>
  </div>
</section>
