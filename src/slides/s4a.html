     S4a · mosmos — "제품보다 먼저 만든 건, 운영 체계였다" + 3 Pillars
     ════════════════════════════════════════════════════════════ -->
<section class="slide" id="s4a" data-section="4">
  <div class="bg">
    <div class="grid-lines"></div>
    <div class="glow g1"></div><div class="glow g2"></div><div class="glow g3"></div>
    <span class="blk b1"></span><span class="blk b2"></span><span class="blk b3"></span><span class="blk b4"></span>
  </div>
  <img class="hlogo rv" style="--d:.1s" src="design-system/assets/logos/mosmos-horizontal-color.svg" alt="mosmos">
  <div class="center">
    <div class="kicker rv" style="--d:.05s">개인의 습관이, 회사의 시스템으로</div>
    <h2 class="headline rv" style="--d:.18s">제품보다 먼저 만든 건, <em>운영 체계</em>였다</h2>
    <p class="sub rv" style="--d:.4s">Mosmos는 런칭 전부터 Notion을 <b>운영 OS</b>로 세운 Notion-native 스타트업이에요.</p>
  </div>
  <!-- WP6 A6: 2 Mon decorations (생성/소통 theme) -->
  <svg class="mon-deco a m-create float rv-pop" style="--d:.9s"><use href="#mon-body"/><use href="#p-create"/></svg>
  <svg class="mon-deco b m-comm float f3 rv-pop" style="--d:1.1s"><use href="#mon-body"/><use href="#p-comm"/></svg>
  <div class="pillars">
    <div class="pillar p1 rv" style="--d:.6s">
      <div class="pi"><svg data-lucide="sprout"></svg></div>
      <h3>생명력 있는 Mos</h3>
      <p><b>내 기억이 성품이 된다</b> — 쓸수록 나를 닮아가는 개인 AI 화신</p>
    </div>
    <div class="pillar p2 rv" style="--d:.78s">
      <div class="pi"><svg data-lucide="compass"></svg></div>
      <h3>결정 피로 없는 실행</h3>
      <p><b>말만 하면 된다</b> — Mos가 필요한 Mon을 골라 결과까지</p>
    </div>
    <div class="pillar p3 rv" style="--d:.96s">
      <div class="pi"><svg data-lucide="refresh-ccw"></svg></div>
      <h3>성장 루프 (Prosumer)</h3>
      <p><b>노하우가 자산이 된다</b> — 좋은 방식이 Skill·Mon이 되어 쌓여요</p>
    </div>
  </div>
