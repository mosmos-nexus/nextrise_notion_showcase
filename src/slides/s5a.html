<!-- ════════════════════════════════════════════════════════════
     S5a · 전환 다리 — "이제, 직접 보여드릴게요" → zoom-in 핸드오프
     ════════════════════════════════════════════════════════════ -->
<!-- EN2: data-steps="1" removed — s5a zoom is a registered hook, not a generic step -->
<!-- WP7 C3: renamed s5→s5a -->
<section class="slide" id="s5a" data-section="5">
  <div class="s5-inner">
    <div class="bg">
      <div class="grid-lines"></div>
      <div class="glow g1"></div><div class="glow g2"></div><div class="glow g3"></div>
      <span class="blk b1"></span><span class="blk b2"></span><span class="blk b4"></span>
    </div>
    <div class="center">
      <h2 class="rv" style="--d:.1s">이제, 직접 보여드릴게요</h2>
      <div class="chips">
        <span class="kw rv" style="--d:.5s"><i class="cdot" style="background:var(--mon-execute)"></i>우리 회사 전용 AI</span>
        <span class="kw rv" style="--d:.65s"><i class="cdot" style="background:var(--mon-create)"></i>AI 스킬</span>
        <span class="kw rv" style="--d:.8s"><img src="assets/logo/slack.svg" alt="">Slack 연동</span>
        <span class="kw rv" style="--d:.95s"><i class="cdot" style="background:var(--mon-organize)"></i>자동 정리</span>
      </div>
    </div>
    <div class="stage-shots">
      <div class="shotcard c1 rv" style="--d:.7s"><img src="assets/resources/mosmos/notion_agent1.svg" alt="Mosmos 워크스페이스 — Notion 에이전트 화면 1"></div>
      <div class="shotcard c3 rv" style="--d:.85s"><img src="assets/resources/mosmos/notion_agent3.svg" alt="Mosmos 워크스페이스 — Notion 에이전트 화면 3"></div>
      <div class="shotcard c2 rv" style="--d:1s"><img src="assets/resources/mosmos/notion_agent2.svg" alt="Mosmos 워크스페이스 — Notion 에이전트 화면 2"></div>
    </div>
    <img class="mos float" src="deck-assets/mos-working.png" alt="Mos가 데모를 준비하는 모습">
    <!-- D6: 시연 전환 멘트 (발표자 승인 카피 교체, CL-1) -->
    <div class="bubble rv" style="--d:1.3s">그럼, 실제 워크스페이스에서 보여드릴게요 — Mon들이 먼저 준비하고 있어요</div>
    <!-- Mon 선진입 — 화면 곳곳에서 중앙 워크스페이스로 빨려 들어감 -->
    <!-- M-fix: --fd = 거리 정규화 비행시간(~280px/s) — 거리 무관 고정 1.7s라 빠른 놈이 '휙' 지나가던 문제 -->
    <svg class="flymon mon m-research" style="--sx:420px;--sy:330px;--tx:480px;--ty:430px;--d:1.7s;--fd:2.3s"><use href="#mon-body"/><use href="#p-research"/></svg>
    <svg class="flymon mon m-analysis" style="--sx:1500px;--sy:300px;--tx:-560px;--ty:460px;--d:1.95s;--fd:2.6s"><use href="#mon-body"/><use href="#p-analysis"/></svg>
    <svg class="flymon mon m-organize" style="--sx:260px;--sy:760px;--tx:660px;--ty:60px;--d:2.2s;--fd:2.4s"><use href="#mon-body"/><use href="#p-organize"/></svg>
    <svg class="flymon mon m-create" style="--sx:1660px;--sy:700px;--tx:-700px;--ty:110px;--d:2.45s;--fd:2.5s"><use href="#mon-body"/><use href="#p-create"/></svg>
    <svg class="flymon mon m-execute" style="--sx:760px;--sy:240px;--tx:180px;--ty:540px;--d:2.7s;--fd:2.05s"><use href="#mon-body"/><use href="#p-execute"/></svg>
    <svg class="flymon mon m-comm" style="--sx:1180px;--sy:250px;--tx:-220px;--ty:520px;--d:2.95s;--fd:2.05s"><use href="#mon-body"/><use href="#p-comm"/></svg>
  </div>
</section>
