<section class="slide" id="s4c" data-section="4">

  <div class="cols">

    </div>
    <div class="preview rv" style="--d:.7s">
      <div class="card">
        <img src="assets/resources/mosmos/notion_ai.png" alt="Notion AI 커스텀 에이전트 — Mosmos C Level Agent">

  <div class="takeaway rv" style="--d:1.1s">

  </div>
  <!-- WP6 A6: 2 Mon decorations (생성/소통 theme) -->

  <svg class="mon-deco b m-comm float f2 rv-pop" style="--d:1.5s"><use href="#mon-body"/><use href="#p-comm"/></svg>
