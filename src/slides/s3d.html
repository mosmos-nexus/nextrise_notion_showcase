<!-- ════════════════════════════════════════════════════════════
     S3d · Proact0 — 지표 count-up + Takeaway + QR 배지 (WP5)
     ════════════════════════════════════════════════════════════ -->
<section class="slide" id="s3d" data-section="3">
  <div class="bg">
    <div class="grid-lines"></div>
    <div class="glow g1"></div><div class="glow g2"></div>
    <span class="blk b2"></span><span class="blk b4"></span>
  </div>
  <header>
    <div class="kicker rv" style="--d:.05s">Notion 위에 조직을 세운 뒤의 변화</div>
    <h2 class="headline rv" style="--d:.18s">숫자로 보는 <em>팀 운영의 변화</em></h2>
  </header>
  <div class="grid4">
    <div class="metric rv" style="--d:.4s">
      <div class="mi"><svg data-lucide="trending-up"></svg></div>
      <div class="num">+<span class="count" data-to="30" data-suffix="%">0</span></div>
      <div class="lbl">노션 보드로 운영해 일정 효율</div>
    </div>
    <div class="metric rv" style="--d:.55s">
      <div class="mi"><svg data-lucide="users"></svg></div>
      <div class="num"><span class="count" data-to="40" data-suffix="+">0</span></div>
      <div class="lbl">AI 에이전트 연구를 노션 하나로 관리</div>
    </div>
    <div class="metric rv" style="--d:.7s">
      <div class="mi"><svg data-lucide="git-branch"></svg></div>
      <div class="num" style="font-size:46px;line-height:1.2">act-operator<br>오픈소스 공개</div>
      <div class="lbl">기획·연구 관리를 노션 하나로</div>
    </div>
  </div>
  <!-- 분석/실행 Mon decorations -->
  <img class="mon a m-analysis float rv-pop" style="--d:1.15s" src="deck-assets/mon-research.png" alt="">
  <img class="mon b m-execute float f3 rv-pop" style="--d:1.3s" src="deck-assets/mon-organize.png" alt="">
  <div class="takeaway rv" style="--d:1.05s">
    <span class="tag">TAKEAWAY</span>
    <p>사람과 AI가 같은 보드에서 일하려면, 먼저 팀 구조부터 설계하세요 — <b>모든 정보의 원본을 노션 한곳에</b> 두는 게 핵심이에요.</p>
  </div>
  <!-- QR 고정 배지 (D6) -->
  <div class="qr-badge rv" style="--d:1.4s">
    <img src="assets/resources/proact0/qr_code.svg" alt="Proact0 QR 코드">
    <span class="qr-label">지금 들어가보세요</span>
  </div>
  <!-- Mos working -->
  <img class="mos float" src="deck-assets/mos-working.png" alt="Mos가 일하는 모습" style="position:absolute;right:64px;bottom:200px;width:200px;z-index:4">
</section>
