<section class="slide" id="s1" data-section="1">

    <svg class="tl-lines" viewBox="0 0 1664 560" preserveAspectRatio="none" aria-hidden="true">

  <p class="s1-sub rv" style="--d:2.8s">개인(블로그) → 오픈소스(Proact0) → 비즈니스(Mosmos) — 변하지 않은 건, 늘 그 중심에 <b>Notion</b>이 있었다는 것</p>
